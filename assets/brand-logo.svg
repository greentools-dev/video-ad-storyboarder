<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 96" width="100%" height="96" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&amp;family=Plus+Jakarta+Sans:wght@500;600&amp;display=swap');
      .brand-title { font-family: 'Fraunces', Georgia, serif; font-size: 34px; font-weight: 700; fill: #111110; letter-spacing: -0.025em; }
      .brand-sub { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #76746E; letter-spacing: 0.16em; text-transform: uppercase; }
      .mark-accent { fill: #1A362B; }
      .mark-bg { fill: #FBFBF9; }
    </style>
  </defs>

  <!-- Architectural Geometric Emblem -->
  <g transform="translate(16, 16)">
    <rect width="64" height="64" rx="16" fill="#111110"/>
    <rect x="14" y="14" width="36" height="36" rx="8" stroke="#EAE8E3" stroke-width="2.5"/>
    <rect x="23" y="23" width="18" height="18" rx="4" class="mark-accent"/>
    <circle cx="32" cy="32" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Editorial Typography -->
  <text x="96" y="47" class="brand-title">LAUNCHIST</text>
  <text x="98" y="67" class="brand-sub">Tools for Intentional Systems</text>
</svg>
